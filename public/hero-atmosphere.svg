<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 220) rotate(90) scale(420 520)">
      <stop stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 640) rotate(90) scale(380 420)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 120) rotate(90) scale(500 280)">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="520" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F1A" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0B0F1A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#070A12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wire" x1="760" y1="180" x2="1380" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="panel" x1="900" y1="260" x2="1320" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="#070A12"/>
  <rect width="1440" height="900" fill="url(#glowA)"/>
  <rect width="1440" height="900" fill="url(#glowB)"/>
  <rect width="1440" height="900" fill="url(#glowC)"/>

  <!-- soft constellation -->
  <g stroke="#94A3B8" stroke-opacity="0.18" stroke-width="1">
    <path d="M120 160 L220 210 L310 140 L420 190"/>
    <path d="M180 320 L260 280 L340 340 L410 300"/>
    <path d="M520 90 L610 150 L700 100"/>
    <path d="M980 80 L1080 140 L1180 90 L1280 160"/>
    <path d="M1100 300 L1200 260 L1310 320"/>
  </g>
  <g fill="#E2E8F0" fill-opacity="0.55">
    <circle cx="120" cy="160" r="1.6"/><circle cx="220" cy="210" r="1.4"/>
    <circle cx="310" cy="140" r="1.8"/><circle cx="420" cy="190" r="1.3"/>
    <circle cx="180" cy="320" r="1.2"/><circle cx="340" cy="340" r="1.5"/>
    <circle cx="610" cy="150" r="1.7"/><circle cx="1080" cy="140" r="1.6"/>
    <circle cx="1200" cy="260" r="1.4"/><circle cx="1310" cy="320" r="1.8"/>
  </g>

  <!-- isometric wireframe structure (right) -->
  <g opacity="0.9">
    <path d="M860 620 L1040 520 L1220 620 L1040 720 Z" fill="url(#panel)" stroke="url(#wire)" stroke-width="1.2"/>
    <path d="M900 560 L1080 460 L1260 560 L1080 660 Z" fill="url(#panel)" stroke="url(#wire)" stroke-width="1.2"/>
    <path d="M940 500 L1120 400 L1300 500 L1120 600 Z" fill="url(#panel)" stroke="url(#wire)" stroke-width="1.2"/>

    <path d="M1040 520 L1040 420 M1080 460 L1080 360 M1120 400 L1120 300" stroke="url(#wire)" stroke-width="1.1" opacity="0.8"/>
    <path d="M1120 300 L1240 230 L1360 300 L1240 370 Z" fill="#0EA5E9" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2"/>
    <path d="M1160 250 L1280 180 L1400 250 L1280 320 Z" fill="#6366F1" fill-opacity="0.1" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1.1"/>

    <!-- vertical tower -->
    <path d="M1230 520 L1290 485 L1290 220 L1230 255 Z" fill="#0F172A" fill-opacity="0.65" stroke="#60A5FA" stroke-opacity="0.45"/>
    <path d="M1290 485 L1350 520 L1350 255 L1290 220 Z" fill="#111827" fill-opacity="0.5" stroke="#22D3EE" stroke-opacity="0.35"/>
    <path d="M1230 255 L1290 220 L1350 255 L1290 290 Z" fill="#1D4ED8" fill-opacity="0.25" stroke="#93C5FD" stroke-opacity="0.55"/>

    <!-- signal rings -->
    <ellipse cx="1290" cy="210" rx="70" ry="22" stroke="#38BDF8" stroke-opacity="0.35" fill="none"/>
    <ellipse cx="1290" cy="210" rx="110" ry="34" stroke="#818CF8" stroke-opacity="0.22" fill="none"/>
    <ellipse cx="1290" cy="210" rx="150" ry="46" stroke="#22D3EE" stroke-opacity="0.12" fill="none"/>

    <!-- floating nodes -->
    <circle cx="980" cy="390" r="4" fill="#38BDF8" fill-opacity="0.8"/>
    <circle cx="1180" cy="330" r="3.5" fill="#A78BFA" fill-opacity="0.75"/>
    <circle cx="1320" cy="410" r="3" fill="#22D3EE" fill-opacity="0.7"/>
    <path d="M980 390 L1120 350 L1180 330 M1180 330 L1290 255" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <rect width="1440" height="900" fill="url(#horizon)"/>
</svg>
